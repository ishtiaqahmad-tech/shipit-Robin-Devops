# A10 - the rollback button (Actions tab -> rollback -> Run workflow)
# Needs GitHub variables: DEPLOY_HOST, TEAM_NAME
name: rollback
on: workflow_dispatch

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TEAM_NAME: ${{ vars.TEAM_NAME }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll back on the server
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          ACTOR: ${{ github.actor }}
        run: |
          BASE="/var/www/$TEAM_NAME"
          # rollback.sh is copied to $BASE/bin/ by the deploy (task A13)
          ssh -o BatchMode=yes deploy@"$HOST" "bash $BASE/bin/rollback.sh '$BASE' '$ACTOR'"

      - name: Report to #TEAM-alerts
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then ICON=":rewind:"; else ICON=":x:"; fi
          jq -n --arg t "$ICON Rollback *$STATUS* | pressed by $ACTOR | <$RUN_URL|workflow run>" '{text:$t}' \
            | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
