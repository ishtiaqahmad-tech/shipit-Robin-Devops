name: rollback

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TEAM_NAME: ${{ vars.TEAM_NAME }}
  DOMAIN: ${{ vars.DOMAIN }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run rollback.sh on server
        run: |
          ssh deploy@"$DEPLOY_HOST" "bash /var/www/$TEAM_NAME/bin/rollback.sh ${{ github.actor }}"

      - name: Health check
        run: |
          curl -fsS -o /dev/null -H "Host: $DOMAIN" "http://$DEPLOY_HOST/"
          echo "Site is up after rollback"

      - name: Slack
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="Rollback ${STATUS} by ${ACTOR} ${RUN_URL}"
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MSG" '{text: $text}')" \
            "$WEBHOOK"
